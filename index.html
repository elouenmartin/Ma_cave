<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ma Cave à Vin (Macavavin)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141010">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --cave-0:#141010;
    --cave-1:#1E1817;
    --cave-2:#2A2220;
    --cave-border:#3C332F;
    --parchment:#EFE6D6;
    --parchment-dim:#B7AB97;
    --wine:#7A1F2B;
    --wine-light:#A8394A;
    --gold:#C9A24B;
    
    /* Légende Couleurs de Maturité */
    --seal-ready:#5C7A52; /* Vert : Bon à boire */
    --seal-keep:#C99E2B;  /* Jaune : À garder */
    --seal-urgent:#A83232;/* Rouge : À boire d'urgence */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--cave-0); color:var(--parchment);
    font-family:'Inter',sans-serif; padding-bottom:80px; min-height:100vh;
  }
  header.app-header{
    position:sticky; top:0; z-index:20; background:var(--cave-0);
    border-bottom:1px solid var(--cave-border); padding:18px 20px 14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  header.app-header h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; }
  header.app-header p{ margin:2px 0 0; font-size:12px; color:var(--parchment-dim); }
  
  main{padding:16px;}
  section{display:none;}
  section.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; background:var(--cave-1); border-top:1px solid var(--cave-border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--parchment-dim);
    font-family:'Inter',sans-serif; font-size:11px; padding:8px 2px 4px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  nav.tabbar button svg{width:22px; height:22px; stroke:var(--parchment-dim); fill:none; stroke-width:1.6;}
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar button.active svg{stroke:var(--gold);}

  .empty{ text-align:center; padding:50px 20px; color:var(--parchment-dim); }
  .empty .glyph{ font-size:34px; margin-bottom:10px; opacity:.6; }
  .empty h3{ font-family:'Fraunces',serif; color:var(--parchment); font-weight:500; margin:0 0 6px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--wine); color:var(--parchment); border:none;
    padding:12px 18px; border-radius:8px; font-size:14px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer;
  }
  .btn.secondary{background:transparent; border:1px solid var(--cave-border); color:var(--parchment);}
  .btn.block{width:100%;}

  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1px solid var(--cave-border);
    font-size:12.5px; color:var(--parchment-dim); background:var(--cave-1); cursor:pointer;
  }
  .chip.active{background:var(--gold); color:#3A2E10; border-color:var(--gold); font-weight:600;}

  .priority-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; margin-bottom:18px;}
  .priority-card{
    flex-shrink:0; width:150px; background:var(--cave-1); border:1px solid var(--cave-border);
    border-radius:10px; padding:10px; position:relative;
  }
  .seal{ position:absolute; top:8px; right:8px; width:11px; height:11px;
